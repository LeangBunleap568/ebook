<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7FA3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)" rx="8"/>
  <!-- Open book icon -->
  <g transform="translate(150,170)" fill="white" opacity="0.85">
    <!-- Left page -->
    <path d="M-70,-50 C-70,-50 -70,60 -70,60 C-70,60 -10,50 -5,55 C-5,55 -5,-55 -5,-55 C-5,-55 -60,-65 -70,-50 Z" />
    <!-- Right page -->
    <path d="M70,-50 C70,-50 70,60 70,60 C70,60 10,50 5,55 C5,55 5,-55 5,-55 C5,-55 60,-65 70,-50 Z" />
    <!-- Spine -->
    <rect x="-5" y="-55" width="10" height="115" rx="2"/>
  </g>
  <text x="150" y="290" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">No Image</text>
</svg>
